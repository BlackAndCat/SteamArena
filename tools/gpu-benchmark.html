<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>进化筛选 · WebGPU 基准</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body { height: auto; overflow: auto; }
    body { max-width: 980px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0 0 6px; color: var(--brass2); font-size: 22px; }
    .panel { margin: 10px 0; padding: 10px 12px; background: var(--dark1); border: 1px solid var(--dark3); }
    .buttons { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    input, select { color: var(--text); background: var(--dark0); border: 1px solid var(--dark3); padding: 5px; font: inherit; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border: 1px solid var(--dark3); padding: 5px 7px; text-align: left; }
    th { color: var(--muted); background: var(--dark2); }
    .ok { color: var(--gauge2); } .bad { color: var(--fire3); }
    pre { white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  </style>
</head>
<body>
  <h1>进化筛选 · WebGPU 基准</h1>
  <p class="muted">实际车辆的热量预测循环。先运行 <code>node tools/gpu-heat-fixture.js</code> 采集当前规则输入；比较原 CPU 函数与 GPU 的首次过热时刻，并包含临界输入。耗时包含上传与回读，结果尚未用于正式筛选。</p>
  <div class="panel">
    <div class="buttons">
      <label>最大批量 <select id="size"><option value="4096">4,096</option><option value="16384" selected>16,384</option><option value="65536">65,536</option><option value="262144">262,144</option><option value="1048576">1,048,576</option></select></label>
      <label>重复次数 <input id="repeat" type="number" min="1" max="5" value="3" style="width:64px"></label>
      <button class="btn primary" id="run">运行基准</button>
      <button class="btn" id="copy">复制 JSON</button>
    </div>
  </div>
  <div id="status" class="panel">尚未运行。</div>
  <div class="panel"><table id="results"><thead><tr><th>预测数</th><th>CPU 总耗时</th><th>上传与提交</th><th>GPU 含回读</th><th>含回读加速</th><th>最大时刻误差</th><th>一致</th></tr></thead><tbody></tbody></table></div>
  <div class="panel"><pre id="json">{}</pre></div>
  <script src="gpu-benchmark.js"></script>
</body>
</html>
