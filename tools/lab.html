<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>视觉样机馆</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* 视觉样机馆：左边按类别 / 版本收纳全部视觉样机，右边框架里打开；登记表在 tools/labs.js */
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-columns: 272px 1fr; }
  aside { display: flex; flex-direction: column; min-height: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 6px), var(--dark1);
    border-right: 3px solid var(--dark0); box-shadow: inset -2px 0 0 var(--dark3); }
  .brand { padding: 16px 14px 10px; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 5px; color: var(--brass2); text-shadow: 2px 2px 0 var(--brass0); }
  .brand p { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
  .filters .btn { font-size: 12px; padding: 3px 8px; }
  nav { overflow: auto; padding: 0 10px 16px; flex: 1; }
  .lb-grp { margin-top: 12px; }
  .lb-grp h2 { margin: 0 4px 6px; font-size: 12px; letter-spacing: 2px; color: var(--iron4); display: flex; justify-content: space-between; }
  .lb-grp h2 small { font-weight: 400; letter-spacing: 0; color: var(--muted); }
  a.item { display: block; text-decoration: none; color: var(--text); padding: 8px 10px 8px 12px; margin-bottom: 6px; background: var(--dark2); border: 2px solid var(--dark0);
    box-shadow: inset 2px 2px 0 var(--dark3), inset -2px -2px 0 var(--dark1); border-left-width: 5px; }
  a.item:hover { background: var(--iron1); }
  a.item.on { background: linear-gradient(160deg, var(--brass3), var(--brass2) 60%, var(--brass1)); color: #2a1a05; box-shadow: inset 2px 2px 0 var(--brass3), inset -2px -2px 0 var(--brass0); }
  a.item.on .meta { color: var(--brass0); }
  a.item b { font-size: 13.5px; }
  a.item .meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .tag { font-size: 10.5px; font-weight: 700; padding: 0 5px; color: #11100e; }
  a.item.archived:not(.on) { opacity: .72; }
  .legend { padding: 10px 14px 14px; border-top: 1px solid var(--dark3); font-size: 11px; line-height: 1.7; color: var(--muted); }
  .legend .tag { margin-right: 4px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .info { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 16px; background: var(--dark2); border-bottom: 3px solid var(--dark0); }
  .info h2 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: 2px; }
  .info .d { flex-basis: 100%; font-size: 12.5px; color: var(--iron4); line-height: 1.5; }
  .info .line { flex-basis: 100%; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .info .line a { color: var(--iron4); text-decoration: none; padding: 1px 6px; border: 1px solid var(--dark3); }
  .info .line a.cur { color: var(--brass3); border-color: var(--brass1); }
  .info .sp { flex: 1; }
  .info .btn { font-size: 12px; padding: 4px 10px; text-decoration: none; }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg0); }
  @media (max-width: 760px) {
    html, body { overflow: auto; height: auto; }
    body { grid-template-columns: 1fr; }
    nav { max-height: 40vh; }
    iframe { height: 80vh; flex: none; }
  }
</style></head>
<body>
<aside>
  <div class="brand"><h1>视觉样机馆</h1><p>全部视觉样机和美术规范，按类别、版本和状态收纳。登记表：<code>tools/labs.js</code></p></div>
  <div class="filters"><button class="btn on" id="showArc">显示历史存档</button></div>
  <nav id="nav"></nav>
  <div class="legend" id="legend"></div>
</aside>
<main>
  <div class="info" id="info"></div>
  <iframe id="frame" title="样机"></iframe>
</main>
<script src="../js/palette.js"></script>
<script src="labs.js"></script>
<script>
(() => {
  const LB = SA.LABS, $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids.filter(k => k != null)); return e; };
  const tag = (s) => { const t = el('span', { className: 'tag', title: LB.STATUS[s].desc }, LB.STATUS[s].name); t.style.background = LB.STATUS[s].color; return t; };
  let showArc = true;
  try { showArc = localStorage.getItem('sa.lab.arc') !== '0'; } catch (e) {}
  const byId = (id) => LB.ITEMS.find(x => x.id === id);
  const current = () => byId(location.hash.slice(1)) || LB.ITEMS.find(x => x.status === 'explore') || LB.ITEMS[0];

  function buildNav() {
    const cur = current();
    $('nav').replaceChildren(...LB.GROUPS.map(gp => {
      // 同组内：现行 / 探索中在前，然后按版本新到旧
      const rank = { live: 0, explore: 1, shipped: 2, archived: 3 };
      const items = LB.ITEMS.filter(x => x.group === gp.id && (showArc || x.status !== 'archived' || x === cur))
        .sort((a, b) => rank[a.status] - rank[b.status] || b.date.localeCompare(a.date));
      if (!items.length) return '';
      return el('div', { className: 'lb-grp' }, el('h2', {}, gp.name, el('small', {}, `${items.length}`)),
        ...items.map(x => {
          const a = el('a', { className: `item ${x.status} ${x === cur ? 'on' : ''}`, href: '#' + x.id, title: x.desc },
            el('b', {}, x.name), el('div', { className: 'meta' }, tag(x.status), el('span', {}, x.ver), el('span', {}, x.date)));
          a.style.borderLeftColor = LB.STATUS[x.status].color;
          return a;
        }));
    }));
  }
  function buildInfo() {
    const x = current(), line = LB.LINES.find(l => l.items.includes(x.id));
    const kids = [el('h2', {}, x.name), tag(x.status), el('span', { className: 'muted' }, `${x.ver} · ${x.date}`), el('span', { className: 'sp' }),
      el('a', { className: 'btn', href: x.url, target: '_blank' }, '新标签页打开 ↗'),
      el('div', { className: 'd' }, x.desc, x.docs && x.docs.length ? el('span', { className: 'muted' }, `　文档：${x.docs.join('、')}`) : null)];
    if (line) kids.push(el('div', { className: 'line' }, `演进线「${line.name}」：`,
      ...line.items.flatMap((id, i) => { const it = byId(id); return [i ? ' → ' : null, el('a', { href: '#' + id, className: id === x.id ? 'cur' : '' }, `${it.ver} ${it.name}`)]; })));
    $('info').replaceChildren(...kids);
    document.title = `${x.name} · 视觉样机馆`;
  }
  function open() {
    const x = current();
    if ($('frame').getAttribute('src') !== x.url) $('frame').setAttribute('src', x.url);
    buildNav(); buildInfo();
  }
  $('legend').append(...Object.keys(LB.STATUS).map(s => el('div', {}, tag(s), LB.STATUS[s].desc)));
  const arcBtn = $('showArc');
  const syncArc = () => { arcBtn.classList.toggle('on', showArc); arcBtn.textContent = showArc ? '显示历史存档' : '隐藏了历史存档'; };
  arcBtn.onclick = () => { showArc = !showArc; try { localStorage.setItem('sa.lab.arc', showArc ? '1' : '0'); } catch (e) {} syncArc(); buildNav(); };
  syncArc();
  addEventListener('hashchange', open);
  open();
})();
</script></body></html>
