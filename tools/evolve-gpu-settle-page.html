      }
      output.measurements = [];
      output.cpuMode = '单页面主线程 JS Number；每次结果的 kw/yo/pivX/全部接地点值进入可见校验和，计时包含校验和开销；不是 14 worker 完整进化任务';
      output.batchNote = '1 条代表单次在线调用；28 条仅为 14 worker×双方车辆的在线并发上界；4096／全量为跨帧聚合的离线吞吐上界，均非完整进化提速';
      for (const [label, count, rounds] of [['online-1', 1, batch.rounds], ['online-upper-28', 28, batch.rounds],
        ['offline-repeat-4096', 4096, batch.rounds], ['offline-all-captured', trace.records.length, batch.rounds],
        ['offline-sustained-A-4096', 4096, 8192], ['offline-sustained-B-4096', 4096, 8192]]) {
        phase = `运行 ${label}`;
        const rows = sampleRows(trace.records, count);
        const cpuStart = now();
        let cpuChecksum = 0;
        for (let round = 0; round < rounds; round++) {
          if (now() > pageDeadline) throw new Error('页面基准超过 60 秒内部截止');
          for (const row of rows) {
            const value = cpuSettle(row);
            cpuChecksum += value.kw + value.yo + value.pivX;
            for (const point of value.pointGnd) cpuChecksum += point;
          }
        }
        const cpuMs = now() - cpuStart, expected = rows.map(originalExpected);
        const entry = { label, count, rounds, totalRecords: count * rounds, scenes: sceneCounts(rows),
          cpuMs, cpuChecksum, gpu: {},
          residency: '各模式仅上传一次真实输入，重复计算后读回一次；持续组测试驻留吞吐' };
        for (const mode of ['direct', 'matrix']) {
          const gpu = await gpuRun(device, pipelines[mode], rows, rounds, mode);
          const actual = unpack(rows, gpu), differences = [];
          let exactRecords = 0, comparedValues = 0, boundaryStateChanges = 0;
          for (let i = 0; i < rows.length; i++) {
            const before = differences.length;
            compare(expected[i], actual[i], mode, i, differences);
            if (differences.length === before) exactRecords++;
            comparedValues += 3 + rows[i].pts.filter(p => p.key).length;
            for (let j = 0; j < rows[i].pts.length; j++) {
              const p = rows[i].pts[j];
              if (!p.key) continue;
              const state = value => value === -p.up ? 'up' : value === p.down ? 'down' : 'free';
              if (state(expected[i].pointGnd[j]) !== state(actual[i].pointGnd[j])) boundaryStateChanges++;
            }
          }
          entry.gpu[mode] = { packMs: gpu.packMs, uploadMs: gpu.uploadMs, computeMs: gpu.computeMs,
            readbackMs: gpu.readbackMs, endToEndMs: gpu.endToEndMs,
            comparedValues, exactValues: comparedValues - differences.length,
            exactValueRate: (comparedValues - differences.length) / comparedValues,
            exactRecords, exactRecordRate: exactRecords / rows.length,
            boundaryStateChanges, mismatchCount: differences.length, firstMismatches: differences.slice(0, 8),
            maxAbsoluteError: differences.reduce((m, x) => Math.max(m, x.absoluteError || 0), 0) };
          issues.push(...differences.slice(0, 8));
        }
        output.measurements.push(entry);
      }
      // 单独记录重复上传/读回的代价；128 批同样真实输入，CPU/GPU 工作量一致。
      phase = '运行离线流式传输';
      const streamRows = sampleRows(trace.records, 4096);
      const streamExpected = streamRows.map(originalExpected);
      const streamRounds = 128;
      const streamValues = streamRows.reduce((sum, row) => sum + 3 + row.pts.filter(p => p.key).length, 0) * streamRounds;
      const streamCpuStart = now();
      let streamCpuChecksum = 0;
      for (let i = 0; i < streamRounds; i++) {
        if (now() > pageDeadline) throw new Error('页面基准超过 60 秒内部截止');
        for (const row of streamRows) {
          const value = cpuSettle(row);
          streamCpuChecksum += value.kw + value.yo + value.pivX;
          for (const point of value.pointGnd) streamCpuChecksum += point;
        }
      }
      output.streaming = { label: 'offline-streaming-4096x128', count: 4096, rounds: streamRounds,
        scenes: sceneCounts(streamRows),
        totalRecords: 4096 * streamRounds, cpuMs: now() - streamCpuStart,
        cpuChecksum: streamCpuChecksum,
        note: '每批重新打包、上传、计算和读回；仍是跨帧离线聚合的传输成本实验', gpu: {} };
      for (const mode of ['direct', 'matrix']) {
        const times = [], differences = [];
        let mismatchCount = 0;
        const sink = { push(issue) { mismatchCount++; if (differences.length < 8) differences.push(issue); } };
        for (let i = 0; i < streamRounds; i++) {
          const sample = await gpuRun(device, pipelines[mode], streamRows, 1, mode);
          const actual = unpack(streamRows, sample);
          for (let j = 0; j < streamRows.length; j++) compare(streamExpected[j], actual[j], `流式 ${mode}`, j, sink);
          times.push({ packMs: sample.packMs, uploadMs: sample.uploadMs, computeMs: sample.computeMs,
            readbackMs: sample.readbackMs, endToEndMs: sample.endToEndMs });
        }
        output.streaming.gpu[mode] = { batches: times,
          totalMs: times.reduce((sum, row) => sum + row.endToEndMs, 0),
          comparedValues: streamValues, exactValues: streamValues - mismatchCount,
          exactValueRate: (streamValues - mismatchCount) / streamValues,
          mismatchCount, firstMismatches: differences };
      }
      phase = '验证构造边界';
      output.constructedBoundary = {};
      for (const mode of ['direct', 'matrix']) {
        const gpu = await gpuRun(device, pipelines[mode], [boundary], 1, mode);
        const differences = [];
        compare(boundary.expected, unpack([boundary], gpu)[0], `构造 ${mode}`, -1, differences);
        output.constructedBoundary[mode] = { exact: differences.length === 0, mismatches: differences };
      }
      output.gpuTaskDoneEpochMs = performance.timeOrigin + now();
      output.mismatchCount = output.measurements.reduce((sum, row) => sum +
        row.gpu.direct.mismatchCount + row.gpu.matrix.mismatchCount, 0) +
        Object.values(output.constructedBoundary).reduce((sum, row) => sum + row.mismatches.length, 0) +
        output.streaming.gpu.direct.mismatchCount + output.streaming.gpu.matrix.mismatchCount;
      output.status = 'ok'; output.executionStatus = 'completed';
      output.eligibility = output.mismatchCount || matrixMismatchCount ? 'rejected' : 'eligible';
      if (output.mismatchCount) output.validationFailure = 'GPU 数值与原 JS Number 逐值不一致；本原型不能替代正式 settle';
      else if (matrixMismatchCount) output.validationFailure = '浏览器中心化 Number 矩阵与同浏览器原顺序公式不一致';
    } catch (error) {
      output.status = 'error'; output.executionStatus = 'failed'; output.eligibility = 'not-evaluated';
      output.phase = phase; output.error = String(error?.message || error);
      output.errorStack = String(error?.stack || error);
    }
    return output;
  }
  window.runBenchmark = runBenchmark;
  (async () => {
    const timeout = new Promise((_resolve, reject) => setTimeout(() => reject(new Error('页面基准超过 60 秒内部截止')), 60000));
    const task = (async () => runBenchmark(await (await fetch('/trace.json')).json()))();
    const result = await Promise.race([task, timeout]);
    document.querySelector('#result').textContent = JSON.stringify(result);
    document.documentElement.dataset.done = 'true';
  })().catch(error => {
    document.querySelector('#result').textContent = JSON.stringify({ kind: 'evolve-gpu-settle-benchmark',
      status: 'error', error: String(error?.message || error) });
    document.documentElement.dataset.done = 'true';
  });
})();
</script></html>
