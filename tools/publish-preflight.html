<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发行前设计归档</title>
  <style>
    body { max-width: 1050px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 sans-serif; color: #e7e1d5; background: #24221f; }
    button, input { font: inherit; } button { padding: .4rem .7rem; margin: .2rem; cursor: pointer; }
    section { margin: 1.2rem 0; padding: 1rem; border: 1px solid #766d5a; }
    .row { display: flex; gap: .6rem; align-items: flex-start; padding: .5rem 0; border-top: 1px solid #514d45; }
    .row div { min-width: 0; overflow-wrap: anywhere; } code { color: #eac687; } small { color: #b8b0a1; }
    pre { overflow: auto; max-height: 10rem; background: #171614; padding: .6rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>发行前设计归档</h1>
  <p>普通工作台保存可能只进入当前浏览器来源的本机草稿。请在使用过的每个 <code>file:</code>、<code>localhost</code> 或 <code>127.0.0.1</code> 页面分别导出作者包，再在本机 HTTP 预检页导入。此页只能看到当前来源的存储，无法扫描其他浏览器资料。</p>
  <section>
    <h2>来源</h2>
    <button id="export">导出当前来源作者包</button>
    <label>导入作者包或页面文字 JSON <input id="import" type="file" accept=".json,application/json" multiple></label>
    <p id="sources"></p>
  </section>
  <section>
    <h2>差异选择</h2>
    <p>差异默认全部选中；不想归档的项目请取消勾选。未勾选内容不会覆盖正式文件。模块属性直接读取正式 <code>js/modules.js</code>，无需导入草稿。</p>
    <div id="diffs"></div>
  </section>
  <button id="archive">归档所选项并生成发行回执</button>
  <p id="status" role="status"></p>
  <script src="author-content.js"></script>
  <script src="publish-preflight.js"></script>
</body>
</html>
