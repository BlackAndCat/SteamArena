<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蒸汽竞技场 · AI 设计候选</title>
  <link rel="stylesheet" href="console.css">
  <style>
    /* 独立候选工具的排版，不影响游戏或现有工作台。 */
    body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans)}
    .ai-page{max-width:1500px;margin:auto;padding:20px}.ai-header,.ai-details{background:var(--paper);border:2px solid var(--line);padding:16px;margin-bottom:16px}
    h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:0 0 10px}p{line-height:1.6;margin:8px 0}
    a{color:var(--ink-2)}button{font:inherit;cursor:pointer;background:var(--brass);color:var(--ink);border:2px solid var(--line-2);padding:8px 12px}button:disabled{opacity:.55;cursor:default}
    .ai-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.ai-tabs button[aria-selected=true]{background:var(--fire)}
    .ai-stage{color:var(--cream);margin:12px 0}.ai-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
    .ai-card{background:var(--paper);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:7px}.ai-card[data-selected=true]{outline:3px solid var(--brass)}
    .ai-card h3{font-size:16px;margin:0}.ai-card img{width:100%;height:auto;image-rendering:pixelated}.ai-card button{margin-top:auto}.ai-card small{line-height:1.5}.ai-badge{font-size:13px;color:var(--ink-2)}
    .ai-status{font-weight:bold}.ai-status[data-kind=weak]{color:var(--bad)}.ai-status[data-kind=target]{color:var(--ok)}
    .ai-detail-grid{display:grid;grid-template-columns:minmax(240px,440px) 1fr;gap:20px}.ai-detail-grid img{width:100%;image-rendering:pixelated}.ai-details dl{display:grid;grid-template-columns:90px 1fr;gap:8px;margin:12px 0}.ai-details dt{font-weight:bold}.ai-details dd{margin:0;line-height:1.5}
    .ai-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.ai-note{font-size:14px;color:var(--ink-2)}.ai-error{background:var(--paper);padding:16px;color:var(--bad)}
    @media(max-width:1100px){.ai-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.ai-page{padding:10px}.ai-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ai-detail-grid{grid-template-columns:1fr}}@media(max-width:430px){.ai-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="ai-page">
    <header class="ai-header">
      <h1 id="chapter-title">AI 设计候选 · 第二～五章 · 120 台</h1>
      <p>每关 5 台，AI 直接设计，设计来源见各车标记。选一台查看详情，再送入本关工作台试改。</p>
      <p class="ai-note">正式实测每车 120 局，双方瞄准 0.8；胜率按（胜＋0.5×平）÷总局数计算，目标 60%～75%。硬规则合法与实战达标分别显示。</p>
      <a href="console.html">返回后台工具</a> · <button type="button" id="stage-link" disabled>将选中车送入工作台</button>
      <span class="ai-note">草稿导入，确认后手动保存</span>
    </header>
    <nav class="ai-tabs" id="chapter-tabs" aria-label="选择章节"></nav>
    <nav class="ai-tabs" id="stage-tabs" aria-label="选择关卡"></nav>
    <p class="ai-stage" id="stage-summary">正在读取候选数据…</p>
    <section class="ai-grid" id="candidate-grid" aria-label="本关候选车辆"></section>
    <section class="ai-details" id="candidate-details" hidden aria-label="选中车辆详情"></section>
    <p id="load-error" class="ai-error" role="alert" hidden></p>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/modules.js"></script>
  <script src="ai-designs.js"></script>
</body>
</html>
