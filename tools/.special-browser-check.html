<!doctype html><meta charset="utf-8"><title>特殊武器浏览器验收</title>
<button onclick="run('first')">首关实射</button><button onclick="run('rocket_rack')">抛射架实射</button><button onclick="run('harpoon')">鱼叉缆绳</button>
<pre id="result">等待游戏加载</pre><iframe id="game" src="../index.html" style="width:1280px;height:850px;border:0"></iframe>
<script>
// 隔离端口的临时验收页：通过正式战斗入口和 debug.step 运行，不写正式关卡或用户常用来源存档。
const frame = document.getElementById('game'), result = document.getElementById('result');
frame.onload = () => { result.textContent = '就绪'; };
function run(id) {
  try {
    const W = frame.contentWindow, SA = W.SA;
    SA.Story.mark('tutorial'); SA.Story.mark('opening');
    W.document.querySelectorAll('.title,.vn').forEach(x => x.remove());
    SA.S.reset();
    if (id === 'first') SA.S.arenaEntries('camp')[0].start();
    else {
      const v = SA.V.create('浏览器专项');
      for (let c = 2; c <= 12; c += 2) v.body[10][c] = SA.newCell('track', 6);
      for (const c of [2,4,10]) v.body[8][c] = SA.newCell('boiler', 6);
      v.body[8][8] = SA.newCell('water', 6); v.body[8][12] = SA.newCell('armor', 6);
      v.body[7][2] = SA.newCell('helmet', 6);
      v.body[id === 'harpoon' ? 7 : 6][id === 'harpoon' ? 12 : 4] = SA.newCell(id, 6);
      SA.S.d.vehicle = v;
      SA.Battle.start({ mode: 'friendly', enemyVehicle: v, terrain: 'flat', boss: true });
    }
    const D = SA.Battle.debug, B = D.B;
    B.frozen = true; B.intro = null;
    B.e.speed = 0; B.e.aiProfile = { heatHoldHigh: -1, heatHoldLow: -2 };
    if (id === 'harpoon') { B.e.x -= 180; B.e.pivX -= 180; }
    const w = B.p.weapons[0], ew = B.e.weapons[0];
    w.m = { ...w.m, wild: 0 }; B.p.prism = true;
    B.p.elev[w.key] = w.m.rest; B.p.timers[w.key] = 0;
    for (let i = 0; i < 600 && !(id === 'harpoon' ? B.p.tether : B.p.events.hit); i++) {
      const point = D.cellCenter('e', ew.r, ew.c, ew.layer);
      D.aimWorld(...point); B.keys.fire = true; B.p.focus = 1; D.step(1/60);
    }
    B.keys.fire = false; D.step(0);
    if (!B.p.events.hit) throw new Error('未实际命中');
    const tether = SA.Battle.tetherState('p');
    if (id === 'harpoon' && !tether) throw new Error('缆绳无目标');
    result.textContent = JSON.stringify({ passed: true, id, fire: B.p.events.fire, hit: B.p.events.hit, highHit: B.p.events.highHit, damage: B.p.dealt, tether: tether && { from: tether.from, to: tether.to } }, null, 2);
  } catch (e) { result.textContent = e.stack; }
}
</script>
