<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关卡车工作台</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body { height: auto; overflow: auto; }
    body { max-width: 1900px; margin: 0 auto; padding: 12px; }
    h1 { margin: 0 0 4px; color: var(--brass2); font-size: 22px; }
    h2 { margin: 18px 0 8px; color: var(--brass3); font-size: 16px; }
    .layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 12px; }
    .panel { background: var(--dark1); border: 1px solid var(--dark3); padding: 10px; }
    .stage-list { display: grid; gap: 4px; }
    .stage-list button { text-align: left; color: var(--text); background: var(--dark0); border: 1px solid var(--dark3); padding: 7px; cursor: pointer; }
    .stage-list button.selected, .stage-list button:hover { border-color: var(--brass2); }
    .tag { display: inline-block; margin-left: 5px; padding: 1px 4px; border: 1px solid var(--dark3); font-size: 10px; color: var(--muted); }
    .tag.manual { color: var(--gauge2); border-color: var(--gauge2); }
    .tag.locked { color: var(--fire3); border-color: var(--fire2); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 8px 12px; }
    label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
    input, select, textarea { width: 100%; box-sizing: border-box; color: var(--text); background: var(--dark0); border: 1px solid var(--dark3); padding: 5px; font: inherit; }
    textarea { min-height: 62px; resize: vertical; }
    .wide { grid-column: 1 / -1; }
    .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0; }
    .preview { min-height: 190px; display: flex; align-items: center; justify-content: center; background: var(--dark0); border: 1px solid var(--dark3); overflow: auto; }
    .preview canvas { image-rendering: pixelated; max-width: 100%; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 5px; }
    .stat { border: 1px solid var(--dark3); padding: 5px 7px; background: var(--dark0); }
    .stat b { display: block; color: var(--brass3); font-size: 16px; }
    .notice { padding: 7px 9px; border: 1px solid var(--dark3); background: var(--dark0); margin: 7px 0; white-space: pre-wrap; }
    .notice.bad { border-color: var(--fire2); color: var(--fire3); }
    .notice.ok { border-color: var(--gauge1); color: var(--gauge2); }
    .notice.warn { border-color: var(--brass2); color: var(--brass3); }
    /* 保存反馈使用非阻塞悬浮气泡，不打断车间操作。 */
    .stage-toast { position: fixed; right: 18px; bottom: 18px; z-index: 90; width: min(430px, calc(100vw - 36px)); padding: 10px 13px; border: 1px solid var(--brass2); background: var(--dark1); color: var(--text); box-shadow: 4px 4px 0 rgba(0,0,0,.42); white-space: pre-wrap; line-height: 1.45; }
    .stage-toast.ok { border-color: var(--gauge1); color: var(--gauge2); }
    .stage-toast.warn { border-color: var(--brass2); color: var(--brass3); }
    .stage-toast.bad { border-color: var(--fire2); color: var(--fire3); }
    .stage-toast[hidden] { display: none; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .tab-button { color: var(--text); background: var(--dark0); border: 1px solid var(--dark3); padding: 7px 11px; cursor: pointer; }
    .tab-button.active, .tab-button:hover { color: var(--brass3); border-color: var(--brass2); background: var(--dark2); }
    .tab-panel[hidden] { display: none; }
    /* 工作台把性能单放到画布下方，让拼装画布取得主要宽度；窄屏允许滚动操作。 */
    .assembly-screen { min-height: 820px; height: clamp(820px, 94vh, 1150px); background: var(--dark0); border: 1px solid var(--dark3); overflow: auto; }
    .assembly-screen #screen { height: 100%; min-height: 0; }
    .assembly-screen .ed { height: 100%; min-width: 960px; box-sizing: border-box; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr) 155px; }
    .assembly-screen .ed-main { grid-column: 1; grid-row: 1; }
    .assembly-screen .ed-sheet { grid-column: 1; grid-row: 2; max-height: none; }
    .assembly-screen .ed-cat { grid-column: 2; grid-row: 1 / 3; }
    /* 搜索和最近使用固定在模块清单标题下；库存列表保留原车间的滚动与拖拽。 */
    .stage-module-tools { display: grid; gap: 5px; padding: 0 12px 8px; border-bottom: 2px solid var(--dark0); }
    .stage-module-tools input { min-width: 0; font-size: 13px; }
    .stage-recent-list { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
    .stage-recent-list:empty { display: none; }
    .stage-recent-module { flex: 0 0 76px; display: grid; justify-items: center; gap: 2px; min-width: 0; padding: 4px; color: var(--text); background: var(--dark0); border: 1px solid var(--dark3); cursor: pointer; }
    .stage-recent-module:hover, .stage-recent-module.selected { border-color: var(--brass2); background: var(--dark2); }
    .stage-recent-module:disabled { opacity: .5; cursor: default; }
    .stage-recent-module:focus-visible { outline: 2px solid var(--brass3); }
    .stage-recent-module canvas { width: 42px !important; height: 36px !important; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
    .stage-recent-module b { max-width: 68px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; }
    .stage-recent-module .muted { font-size: 10px; }
    .stage-search-empty { padding: 12px 4px; }
    .stage-module-tools[hidden], .assembly-screen .panel-list > [hidden] { display: none; }
    .assembly-empty { min-height: 240px; display: grid; place-items: center; text-align: center; padding: 20px; }
    .assembly-empty[hidden] { display: none; }
    .assembly-empty b { color: var(--brass3); font-size: 18px; }
    .fold { border: 1px solid var(--dark3); background: var(--dark0); padding: 8px 10px; margin: 7px 0; }
    .fold > summary { cursor: pointer; color: var(--brass3); font-weight: 700; }
    .fold > .grid, .fold > .buttons, .fold > .notice { margin-top: 9px; }
    .module-summary { min-height: 31px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
    .module-summary .chip { display: inline-flex; align-items: center; gap: 5px; color: var(--brass3); }
    .module-summary .chip canvas { width: 28px; height: 28px; image-rendering: pixelated; }
    .module-picker { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(7, 8, 12, .78); }
    .module-picker[hidden] { display: none; }
    .module-picker-window { width: min(1080px, 100%); max-height: min(840px, calc(100vh - 32px)); display: flex; flex-direction: column; background: var(--dark1); border: 2px solid var(--brass2); box-shadow: 5px 5px 0 rgba(0,0,0,.45); }
    .module-picker-head { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--brass1); color: #2a1a05; }
    .module-picker-head b { flex: 1; }
    .module-picker-grid { overflow: auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px; }
    .module-card { display: grid; grid-template-columns: 24px 46px minmax(0, 1fr); grid-template-rows: auto auto; gap: 2px 7px; align-items: center; min-height: 58px; padding: 5px; color: var(--text); background: var(--dark0); border: 1px solid var(--dark3); cursor: pointer; }
    .module-card:hover, .module-card.selected { border-color: var(--brass2); background: var(--dark2); }
    .module-card input { width: auto; grid-column: 1; grid-row: 1 / span 2; justify-self: center; accent-color: var(--brass2); }
    .module-card canvas { grid-column: 2; grid-row: 1 / span 2; justify-self: center; width: 42px; height: 42px; image-rendering: pixelated; pointer-events: none; }
    .module-card .module-name { grid-column: 3; font-weight: 700; color: var(--brass3); }
    .module-card .module-desc { grid-column: 3; color: var(--muted); font-size: 11px; line-height: 1.25; max-height: 29px; overflow: hidden; }
    .module-picker-foot { display: flex; justify-content: flex-end; gap: 7px; padding: 9px 12px; border-top: 1px solid var(--dark3); }
    .tool-actions { margin-top: 8px; }
    #side { display: none; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border: 1px solid var(--dark3); padding: 4px 6px; text-align: left; }
    th { color: var(--muted); background: var(--dark2); }
    .muted { color: var(--muted); font-size: 12px; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>关卡车工作台</h1>
  <p class="muted"><a class="btn" href="module-editor.html" target="_blank" rel="noopener">打开模块属性工作台 ↗</a></p>
  <p class="muted">“保存到进化擂台”保留候选构筑，自动标记手工修改并可参与后续进化。“保存为手工关卡车”才会立即同步正式游戏，并在写入服务可用时同步到 <code>js/stage-cars.js</code>。拼装过程使用独立设计存档。</p>
  <div id="arena-notice" class="notice" hidden></div>
  <div class="layout">
    <aside class="panel">
      <h2>全部章节</h2>
      <div id="stage-list" class="stage-list"></div>
      <h2>进度一览</h2>
      <div id="progress"></div>
    </aside>
    <main>
      <div class="tabs" role="tablist" aria-label="关卡车编辑页签">
        <button class="tab-button active" data-tab="assembly" role="tab">拼装车间</button>
        <button class="tab-button" data-tab="overview" role="tab">车辆概览</button>
        <button class="tab-button" data-tab="fields" role="tab">关卡文字</button>
        <button class="tab-button" data-tab="reward" role="tab">奖励与解锁</button>
        <button class="tab-button" data-tab="tuning" role="tab">强度调节</button>
      </div>
      <div class="buttons tool-actions">
        <button class="btn primary" id="save-arena">保存到进化擂台</button>
        <a class="btn" href="evolve.html#grid" id="back-arena">返回进化擂台</a>
        <button class="btn primary" id="save">保存为手工关卡车</button>
        <button class="btn" id="unlock">解锁（允许进化器改）</button>
        <button class="btn" id="relock">重新锁定</button>
        <button class="btn" id="import">导入分享码 / 模块清单</button>
        <select id="candidate" style="max-width:320px"><option value="">进化报告候选车</option></select>
        <button class="btn" id="candidate-import">拿候选车作底稿</button>
        <button class="btn" id="drive">一键试驾</button>
      </div>
      <div id="import-box" class="notice" hidden>
        <label>粘贴 SA2 分享码或完整模块清单 JSON<textarea id="import-value" placeholder="SA2.… 或 [[层,行,列,id,材料,改装等级],…]"></textarea></label>
        <div class="buttons"><button class="btn primary" id="import-confirm">确认导入</button><button class="btn" id="import-cancel">取消</button></div>
      </div>
      <section class="panel tab-panel" data-tab-panel="assembly">
        <div id="assembly-title"></div>
        <div class="buttons">
          <button class="btn primary" id="assembly-open">重新打开拼装车间</button>
          <button class="btn" id="assembly-exit">结束拼装并恢复正式存档</button>
        </div>
        <div id="assembly-empty" class="assembly-empty"><div><b>这里就是改装台</b><p class="muted">选中左侧关卡后会自动进入车间。右侧模块清单里的模块可以直接选中，再点击车体格子安装；也可以拖动、对调、拆下。</p></div></div>
        <div id="assembly-screen" class="assembly-screen" hidden><div id="screen"></div></div>
      </section>
      <section class="panel tab-panel" data-tab-panel="overview" hidden>
        <div id="title"></div>
        <div id="preview" class="preview"></div>
        <div id="stats" class="stats"></div>
        <div id="warnings"></div>
      </section>
      <section class="panel tab-panel" data-tab-panel="fields" hidden>
        <div id="title-fields"></div>
        <h2>关卡文字</h2>
        <div class="grid">
          <label>关卡名<input id="name"></label>
          <label>车名<input id="vehicle-name" maxlength="20"></label>
          <label>驾驶员<input id="pilot"></label>
          <label class="wide">赛前介绍<textarea id="blurb"></textarea></label>
          <label class="wide">弱点提示<textarea id="weakness"></textarea></label>
        </div>
      </section>
      <section class="panel tab-panel" data-tab-panel="reward" hidden>
        <h2>奖励与解锁</h2>
        <div class="grid">
          <label class="wide">通关解锁模块
            <input id="unlock-mods" type="hidden">
            <button class="btn" id="open-modules" type="button">打开模块选择窗口</button>
            <span id="unlock-mods-summary" class="module-summary muted">未选择</span>
          </label>
          <label>通关解锁功能（逗号分隔）<input id="unlock-feat" placeholder="例如 side,upgrade"></label>
          <label>通关解锁最高材料<input id="unlock-mat" type="number" min="0" max="6" step="1" placeholder="不改动"></label>
          <label>通关解锁改装台<input id="unlock-grid" placeholder="例如 6x4"></label>
          <label class="wide">可缴获件（JSON）<textarea id="loot" placeholder='[{"id":"boss_lens","mt":5,"once":true}]'></textarea></label>
        </div>
      </section>
      <section class="panel tab-panel" data-tab-panel="tuning" hidden>
        <details class="fold" open>
          <summary>枪法、AI 和场地强度微调</summary>
          <div class="grid">
            <label>AI 性格<select id="style"><option value="wander">游走</option><option value="rush">冲锋</option><option value="kite">放风筝</option><option value="turtle">龟缩</option></select></label>
            <label>枪法（0～1）<input id="aim" type="number" min="0" max="1" step="0.01"></label>
            <label>场地<select id="terrain"></select></label>
            <label>Boss <input id="boss" type="checkbox"></label>
            <label>奖金<input id="prize" type="number" min="0" step="10"></label>
          </div>
        </details>
        <details class="fold" open>
          <summary>固定种子快速测试</summary>
          <div class="buttons"><label style="display:flex;align-items:center;gap:6px">每种参考车局数 <input id="games" type="number" value="20" min="1" max="200" style="width:90px"></label><button class="btn primary" id="test">固定种子测试</button></div>
          <div id="test-result" class="notice">尚未测试。</div>
        </details>
      </section>
    </main>
  </div>
  <div id="module-picker" class="module-picker" hidden>
    <div class="module-picker-window" role="dialog" aria-modal="true" aria-labelledby="module-picker-title">
      <div class="module-picker-head"><b id="module-picker-title">选择通关解锁模块</b><span class="muted">图片来自游戏模块精灵</span></div>
      <div id="module-picker-grid" class="module-picker-grid"></div>
      <div class="module-picker-foot"><button class="btn" id="module-picker-cancel">取消</button><button class="btn primary" id="module-picker-confirm">确定选择</button></div>
    </div>
  </div>
  <div id="side" hidden></div>
  <div id="modal" hidden></div>
  <div id="stage-toast" class="stage-toast" role="status" aria-live="polite" hidden></div>
  <script src="../js/palette.js"></script>
  <script src="../js/modules.js"></script>
  <script src="../js/module-art.js"></script>
  <script src="../js/dynamics.js"></script>
  <script src="../js/sprites.js"></script>
  <script src="../js/ui-px.js"></script>
  <script src="../js/legs.js"></script>
  <script src="../js/vehicle.js"></script>
  <script>window.SA_STAGE_CARS_SCRIPT = true;</script>
  <script src="../js/content.js"></script>
  <script src="../js/build-sys.js"></script>
  <script src="../js/stage-cars.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/camp.js"></script>
  <script src="../js/camp-ui.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/terrain-art.js"></script>
  <script src="../js/scenes.js"></script>
  <script src="../js/battle-view.js"></script>
  <script src="../js/battle.js"></script>
  <script src="../js/evolve-arena.js"></script><script src="stage-editor.js"></script>
</body>
</html>
