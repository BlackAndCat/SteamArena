<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼装台</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* 后台「关卡」工作区里嵌着的拼装台：整页只放游戏车间编辑器 */
    html, body { height: 100%; overflow: hidden; }
    #side { display: none; }
    .assembly-screen { height: 100vh; overflow: auto; }
    .assembly-screen #screen { height: 100%; min-height: 0; }
    .assembly-screen .ed { height: 100%; min-width: 720px; min-height: 540px; box-sizing: border-box; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr) 155px; }
    /* 游戏在窄屏（≤800px）把模块清单压到 40% 高；拼装台一直是左右两栏，不要这条 */
    .assembly-screen .ed-cat .ed-panel { max-height: none; }
    .assembly-screen .ed-main { grid-column: 1; grid-row: 1; }
    .assembly-screen .ed-sheet { grid-column: 1; grid-row: 2; max-height: none; }
    .assembly-screen .ed-cat { grid-column: 2; grid-row: 1 / 3; }
    .garage-search { display: grid; gap: 4px; padding: 0 12px 8px; }
    .garage-search input { width: 100%; box-sizing: border-box; padding: 4px 6px; border: 2px solid #8e6238; background: #f8f1dc; color: #2a1a05; font: 13px "Microsoft YaHei", sans-serif; }
    .garage-search .none { font-size: 12px; color: #7a6448; }
    .assembly-screen .panel-list > [hidden] { display: none; }
    /* 「回院子 / 出战」是游戏里的出口，后台里没有院子可回 */
    .assembly-screen .ed-lever { display: none; }
  </style>
</head>
<body>
  <div id="assembly-screen" class="assembly-screen"><div id="screen"></div></div>
  <!-- 游戏界面代码要用的挂点：顶栏（这里不显示）、弹窗、小提示 -->
  <div id="side" hidden></div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
  <script>window.SA_STAGE_CARS_SCRIPT = true;</script>
  <script src="../js/release.js"></script>
  <script src="../js/palette.js"></script>
  <script src="../js/modules.js"></script>
  <script src="../js/module-art.js"></script>
  <script src="../js/dynamics.js"></script>
  <script src="../js/sprites.js"></script>
  <script src="../js/ui-px.js"></script>
  <script src="../js/legs.js"></script>
  <script src="../js/vehicle.js"></script>
  <script src="../js/content.js"></script>
  <script src="../js/build-sys.js"></script>
  <script src="../js/stage-cars.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/camp.js"></script>
  <script src="../js/camp-ui.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/terrain-art.js"></script>
  <script src="../js/scenes.js"></script>
  <script src="../js/battle-view.js"></script>
  <script src="../js/battle.js"></script>
  <script src="../js/evolve-arena.js"></script>
  <script src="console-garage.js"></script>
</body>
</html>
