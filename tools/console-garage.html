<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼装台</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* 后台「关卡」工作区里嵌着的拼装台：整页只放游戏车间编辑器 */
    html, body { height: 100%; overflow: hidden; }
    #side { display: none; }
    .assembly-screen { height: 100vh; overflow: auto; }
    .assembly-screen #screen { height: 100%; min-height: 0; }
    /* 性能单占左侧窄栏，蓝图占中间剩余空间；三个区域分别滚动，避免长诊断挤掉蓝图。 */
    .assembly-screen .ed { height: 100%; min-width: 920px; min-height: 0; box-sizing: border-box; grid-template-columns: 240px minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr); }
    /* 游戏在窄屏（≤800px）把模块清单压到 40% 高；拼装台一直是左右两栏，不要这条 */
    .assembly-screen .ed-cat .ed-panel { max-height: none; }
    .assembly-screen .ed-main { grid-column: 2; grid-row: 1; }
    /* 原因完整保留在可滚动性能单内，窄栏长文本自动换行。 */
    .assembly-screen .ed-sheet { grid-column: 1; grid-row: 1; max-height: none; overflow: auto; overflow-wrap: anywhere; }
    /* 像素仪表原本要求「名称＋100px条＋数字」同排；窄栏改为数字另起一行，保留完整读数。 */
    .assembly-screen .ed-sheet-paper { min-height: 0; min-width: 0; grid-template-columns: minmax(0, 1fr); }
    .assembly-screen .ed-sheet-paper > *, .assembly-screen .px-stats > * { min-width: 0; }
    .assembly-screen .px-stats { grid-template-columns: minmax(0, 1fr); }
    .assembly-screen .px-stats .px-row { grid-template-columns: 36px minmax(0, 1fr) !important; }
    .assembly-screen .px-stats .px-row > :last-child { grid-column: 1 / -1; }
    .assembly-screen .ed-sheet canvas { max-width: 100%; height: auto !important; }
    .assembly-screen .ed-sheet-row { flex-wrap: wrap; }
    .garage-diagnostics { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; overflow-wrap: anywhere; }
    .assembly-screen .ed-cat { grid-column: 3; grid-row: 1; }
    /* 目录图片沿用像素画，但限制显示宽度；清单单列可收缩，长名称和标签自行换行。 */
    .assembly-screen .panel-list { min-width: 0; grid-template-columns: minmax(0, 1fr); }
    .assembly-screen .mrow { min-width: 0; gap: 6px; }
    .assembly-screen .mrow .pic { width: 72px; min-width: 0; }
    .assembly-screen .mrow .pic canvas { max-width: 64px !important; height: auto !important; }
    .assembly-screen .mrow .nm, .assembly-screen .mrow .ks span { overflow-wrap: anywhere; white-space: normal; }
    /* 材料纸签原本不换行；窄目录内允许纸签与唯一标记换行，避免撑出名称栏。 */
    .assembly-screen .mrow .mt { min-width: 0; flex-wrap: wrap; }
    .assembly-screen .mrow .mt > * { min-width: 0; max-width: 100%; box-sizing: border-box; white-space: normal; overflow-wrap: anywhere; }
    .assembly-screen .mrow .mt .px-tag { height: auto; min-height: 30px; }
    .assembly-screen .mrow .mt .px-tag > .body { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
    .assembly-screen .panel-row { flex-wrap: wrap; }
    .garage-search { display: grid; gap: 4px; padding: 0 12px 8px; }
    .garage-search input { width: 100%; box-sizing: border-box; padding: 4px 6px; border: 2px solid #8e6238; background: #f8f1dc; color: #2a1a05; font: 13px "Microsoft YaHei", sans-serif; }
    .garage-search .none { font-size: 12px; color: #7a6448; }
    .assembly-screen .panel-list > [hidden] { display: none; }
    /* 「回院子 / 出战」是游戏里的出口，后台里没有院子可回 */
    .assembly-screen .ed-lever { display: none; }
  </style>
</head>
<body>
  <div id="assembly-screen" class="assembly-screen"><div id="screen"></div></div>
  <!-- 游戏界面代码要用的挂点：顶栏（这里不显示）、弹窗、小提示 -->
  <div id="side" hidden></div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
  <script>window.SA_STAGE_CARS_SCRIPT = true;</script>
  <script src="../js/release.js"></script>

  <script src="../js/content.js"></script>
  <script src="../js/build-sys.js"></script>
  <script src="../js/stage-cars.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/camp.js"></script>
  <script src="../js/camp-ui.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/terrain-art.js"></script>
  <script src="../js/scenes.js"></script>
  <script src="../js/battle-view.js"></script>

</body>
